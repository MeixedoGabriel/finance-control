<div class="form-container">
  <h2>{{ 'Editar Movimentação' if movimentacao else 'Nova Movimentação' }}</h2>
  
  <form method="POST" class="form-financeiro">
    
    <div class="form-group">
      <label for="descricao">Descrição</label>
      <input
        type="text"
        id="descricao"
        name="descricao"
        placeholder="Ex: Salário, Supermercado..."
        value="{{ movimentacao.descricao if movimentacao else '' }}"
        required
      >
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="valor">Valor (R$)</label>
        <input
          type="number"
          step="0.01"
          min="0"
          id="valor"
          name="valor"
          placeholder="0,00"
          value="{{ movimentacao.valor if movimentacao else '' }}"
          required
        >
      </div>

      <div class="form-group">
        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo">
          <option value="Receita" {% if movimentacao and movimentacao.tipo == "Receita" %}selected{% endif %}>
            Receita
          </option>
          <option value="Despesa" {% if movimentacao and movimentacao.tipo == "Despesa" %}selected{% endif %}>
            Despesa
          </option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="categoria">Categoria</label>
        <input
          type="text"
          id="categoria"
          name="categoria"
          placeholder="Ex: Alimentação, Lazer..."
          value="{{ movimentacao.categoria if movimentacao else '' }}"
          required
        >
      </div>

      <div class="form-group">
        <label for="data">Data</label>
        <input
          type="date"
          id="data"
          name="data"
          value="{{ movimentacao.data.strftime('%Y-%m-%d') if movimentacao else '' }}"
          required
        >
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-salvar">Salvar Movimentação</button>
    </div>

  </form>
</div>
