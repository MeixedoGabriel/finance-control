<form method="POST">

    <label for="descricao">Descrição</label>
    <input
        type="text"
        id="descricao"
        name="descricao"
        value="{{ movimentacao.descricao if movimentacao else '' }}"
        required
    >

    <label for="valor">Valor</label>
    <input
        type="number"
        step="0.01"
        id="valor"
        name="valor"
        value="{{ movimentacao.valor if movimentacao else '' }}"
        required
    >

    <label for="categoria">Categoria</label>
    <input
        type="text"
        id="categoria"
        name="categoria"
        value="{{ movimentacao.categoria if movimentacao else '' }}"
        required
    >

    <label for="tipo">Tipo</label>

    <select id="tipo" name="tipo">

        <option value="Receita"
            {% if movimentacao and movimentacao.tipo == "Receita" %}selected{% endif %}>
            Receita
        </option>

        <option value="Despesa"
            {% if movimentacao and movimentacao.tipo == "Despesa" %}selected{% endif %}>
            Despesa
        </option>

    </select>

    <label for="data">Data</label>

    <input
        type="date"
        id="data"
        name="data"
        value="{{ movimentacao.data.strftime('%Y-%m-%d') if movimentacao else '' }}"
        required
    >

    <button type="submit">
        Salvar
    </button>

</form>
